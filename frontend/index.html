<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1514" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Synapse brings messages, video meetings, tasks and a shared whiteboard into one workspace."
    />
    <title>Synapse</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved accent colour before first paint so it never flashes the default. -->
    <script>
      try {
        var accent = localStorage.getItem("synapse-accent");
        if (accent) document.documentElement.setAttribute("data-accent", accent);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
